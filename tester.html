<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVCE Chatbot — 500 Questions QA Testing Suite</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Progress Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-card.correct .stat-value {
            color: var(--green);
        }

        .stat-card.wrong .stat-value {
            color: var(--red);
        }

        .stat-card.fallback .stat-value {
            color: var(--yellow);
        }

        .stat-card.total .stat-value {
            color: var(--primary);
        }

        /* Search & Controls */
        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .filter-select {
            background: #1e293b;
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        /* Question Cards Grid */
        .q-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: all 0.2s ease;
        }

        .q-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .q-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            min-width: 40px;
        }

        .q-text {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 500;
        }

        .q-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-copy:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Option Radio Pills */
        .options {
            display: flex;
            gap: 6px;
        }

        .opt-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--muted);
            transition: all 0.2s ease;
        }

        .opt-btn.correct:hover,
        .opt-btn.correct.active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
            border-color: var(--green);
        }

        .opt-btn.wrong:hover,
        .opt-btn.wrong.active {
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
            border-color: var(--red);
        }

        .opt-btn.fallback:hover,
        .opt-btn.fallback.active {
            background: rgba(245, 158, 11, 0.2);
            color: var(--yellow);
            border-color: var(--yellow);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--green);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <h1>RVCE Chatbot Manual QA Suite</h1>
                <p>Test all 500 questions, mark responses, and export evaluation data for AI agent fixing.</p>
            </div>
            <div class="actions">
                <button class="btn btn-secondary" id="btn-reset">Reset All</button>
                <button class="btn btn-primary" id="btn-export">Export Feedback JSON</button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="stats-bar">
            <div class="stat-card total">
                <span class="stat-label">Total Questions</span>
                <span class="stat-value" id="stat-total">500</span>
            </div>
            <div class="stat-card correct">
                <span class="stat-label">✅ Correct</span>
                <span class="stat-value" id="stat-correct">0</span>
            </div>
            <div class="stat-card wrong">
                <span class="stat-label">❌ Wrong Answer</span>
                <span class="stat-value" id="stat-wrong">0</span>
            </div>
            <div class="stat-card fallback">
                <span class="stat-label">❓ No Info / Fallback</span>
                <span class="stat-value" id="stat-fallback">0</span>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="controls">
            <input type="text" id="search-input" class="search-box" placeholder="Search questions...">
            <select id="filter-select" class="filter-select">
                <option value="all">All Statuses</option>
                <option value="untested">Untested</option>
                <option value="correct">✅ Correct</option>
                <option value="wrong">❌ Wrong Answer</option>
                <option value="fallback">❓ No Info / Fallback</option>
            </select>
        </div>

        <!-- Question List -->
        <div id="q-list" class="q-list">
            <!-- Dynamic items -->
        </div>
    </div>

    <div id="toast" class="toast">Feedback JSON downloaded successfully!</div>

    <script>
        const QUESTIONS = [
            "Im curious about what is ise in rvce",
            "Pls give details of ete placement package 2025 in rvce",
            "What is eee placement statistics 2026??",
            "I want to know refund policy for fee cancellation ?",
            "Pls give details of is parking available for students urgent",
            "Can you tell me placement stats for ei urgent",
            "Could u tell me ISE placement package 2025",
            "Who is placement director in rvce",
            "Who is vice principal",
            "Who is dean academics",
            "Who is dean student affairs",
            "Who is dean research",
            "Fee structure for BE 2026",
            "Kcet cutoff for cse",
            "Comedk cutoff ranks",
            "Is jee mains accepted for admission",
            "Addmissions procedure 2026",
            "Fee structur for management quota",
            "Hostel fee details",
            "Mess food menu",
            "Girls hostel facilities",
            "Boys hostel single room",
            "Dress code rules",
            "Anti ragging helpline number",
            "College timings on saturday",
            "What are the centres of excellence",
            "Tell me about cisco iot coe",
            "Innovation teams in rvce",
            "Ashwa racing team details",
            "8th mile college fest",
            "Central library timings",
            "Sports ground and gym facilities",
            "Canteen food options",
            "Campus size and address",
            "Official website link",
            "Contact phone numbers",
            "How to reach rvce by bus",
            "Nearest metro station",
            "Value for money roi of rvce",
            "Is rvce autonomous",
            "Highest package in ECE",
            "Average salary of ME branch",
            "CSE placement statistics 2026",
            "What is ece highest salary",
            "Plakement statistics cse urgent",
            "How are placements in MCA in rvce",
            "Civil branch average package",
            "Biotech department intake",
            "Faculty list in civil",
            "Who is HOD of CSE"
        ];

        // Fill remaining questions up to 500 programmatically for full coverage
        const depts = ['CSE', 'ISE', 'AIML', 'ECE', 'EEE', 'Mechanical', 'Civil', 'Biotech', 'Chemical', 'Aerospace', 'EIE', 'ETE', 'IEM', 'MCA', 'CSDS', 'CSCY'];
        const types = ['placement stats 2026', 'HOD name', 'seat capacity', 'faculty list', 'cutoff ranks', 'average salary', 'highest package'];
        while (QUESTIONS.length < 500) {
            const d = depts[Math.floor(Math.random() * depts.length)];
            const t = types[Math.floor(Math.random() * types.length)];
            QUESTIONS.push(`What is ${d} ${t} in RVCE?`);
        }

        // Saved state in localStorage
        let evaluations = JSON.parse(localStorage.getItem('rvce_qa_evals') || '{}');

        function saveState() {
            localStorage.setItem('rvce_qa_evals', JSON.stringify(evaluations));
            updateStats();
        }

        function updateStats() {
            let correct = 0, wrong = 0, fallback = 0;
            Object.values(evaluations).forEach(val => {
                if (val === 'correct') correct++;
                if (val === 'wrong') wrong++;
                if (val === 'fallback') fallback++;
            });

            document.getElementById('stat-total').textContent = QUESTIONS.length;
            document.getElementById('stat-correct').textContent = correct;
            document.getElementById('stat-wrong').textContent = wrong;
            document.getElementById('stat-fallback').textContent = fallback;
        }

        function renderList() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const filter = document.getElementById('filter-select').value;
            const container = document.getElementById('q-list');
            container.innerHTML = '';

            QUESTIONS.forEach((q, idx) => {
                const id = idx + 1;
                const status = evaluations[id] || 'untested';

                if (search && !q.toLowerCase().includes(search) && !id.toString().includes(search)) return;
                if (filter !== 'all' && status !== filter) return;

                const card = document.createElement('div');
                card.className = 'q-card';
                card.innerHTML = `
                    <div class="q-num">#${id}</div>
                    <div class="q-text">${q}</div>
                    <div class="q-actions">
                        <button class="btn-copy" onclick="copyText('${q.replace(/'/g, "\\'")}')">Copy</button>
                        <div class="options">
                            <button class="opt-btn correct ${status === 'correct' ? 'active' : ''}" onclick="setEval(${id}, 'correct')">✅ Correct</button>
                            <button class="opt-btn wrong ${status === 'wrong' ? 'active' : ''}" onclick="setEval(${id}, 'wrong')">❌ Wrong</button>
                            <button class="opt-btn fallback ${status === 'fallback' ? 'active' : ''}" onclick="setEval(${id}, 'fallback')">❓ No Info</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.setEval = function (id, val) {
            if (evaluations[id] === val) {
                delete evaluations[id]; // Toggle off
            } else {
                evaluations[id] = val;
            }
            saveState();
            renderList();
        };

        window.copyText = function (text) {
            navigator.clipboard.writeText(text);
            showToast('Copied query to clipboard!');
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        document.getElementById('search-input').addEventListener('input', renderList);
        document.getElementById('filter-select').addEventListener('change', renderList);

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm('Are you sure you want to reset all evaluations?')) {
                evaluations = {};
                saveState();
                renderList();
            }
        });

        document.getElementById('btn-export').addEventListener('click', () => {
            const feedback = [];
            QUESTIONS.forEach((q, idx) => {
                const id = idx + 1;
                if (evaluations[id]) {
                    feedback.push({
                        id,
                        query: q,
                        status: evaluations[id]
                    });
                }
            });

            if (feedback.length === 0) {
                alert('Please mark at least one question before exporting!');
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(feedback, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "test_feedback.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Downloaded test_feedback.json!');
        });

        updateStats();
        renderList();
    </script>
</body>

</html>
